# Unit voices: our own (IDEA-31, artsrc/audio/generate_voices_kokoro.py), DogVoice from CC0 recordings.
# Japan, South Korea and China share the East Asian accent voices (artsrc/audio/generate_eastasia.py).
# England has British voices (artsrc/audio/generate_england.py).
# India and Pakistan share the Indian accent voices (artsrc/audio/generate_southasia.py).
GenericVoice:
	DefaultVariant: .ogg
	DefaultPrefix: ra|audio/voices/
	Prefixes:
		allies: ra|audio/voices/union-inf1/,ra|audio/voices/union-inf2/
		usa: ra|audio/voices/union-inf1/,ra|audio/voices/union-inf2/
		england: ra|audio/voices/england-inf1/,ra|audio/voices/england-inf2/
		france: ra|audio/voices/union-inf1/,ra|audio/voices/union-inf2/
		germany: ra|audio/voices/union-inf1/,ra|audio/voices/union-inf2/
		japan: ra|audio/voices/eastasia-inf1/,ra|audio/voices/eastasia-inf2/
		southkorea: ra|audio/voices/eastasia-inf1/,ra|audio/voices/eastasia-inf2/
		italy: ra|audio/voices/union-inf1/,ra|audio/voices/union-inf2/
		egypt: ra|audio/voices/union-inf1/,ra|audio/voices/union-inf2/
		soviet: ra|audio/voices/vanguard-inf1/,ra|audio/voices/vanguard-inf2/
		russia: ra|audio/voices/vanguard-inf1/,ra|audio/voices/vanguard-inf2/
		ukraine: ra|audio/voices/vanguard-inf1/,ra|audio/voices/vanguard-inf2/
		cuba: ra|audio/voices/vanguard-inf1/,ra|audio/voices/vanguard-inf2/
		india: ra|audio/voices/southasia-inf1/,ra|audio/voices/southasia-inf2/
		china: ra|audio/voices/eastasia-inf1/,ra|audio/voices/eastasia-inf2/
		turkey: ra|audio/voices/vanguard-inf1/,ra|audio/voices/vanguard-inf2/
		pakistan: ra|audio/voices/southasia-inf1/,ra|audio/voices/southasia-inf2/
		iran: ra|audio/voices/vanguard-inf1/,ra|audio/voices/vanguard-inf2/
	DisablePrefixes: Die, Burned, Zapped
	Voices:
		Select: await1,ready,report1,yessir1
		Action: ackno,affirm1,noprob,overout,ritaway,roger,ugotit
		Die: deaths/dedman1,deaths/dedman2,deaths/dedman3,deaths/dedman4,deaths/dedman5,deaths/dedman7,deaths/dedman8
		Burned: deaths/dedman10
		Zapped: deaths/dedman6

