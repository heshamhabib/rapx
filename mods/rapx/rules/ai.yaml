Player:
	ModularBot@EasyAI:
		Name: bot-easy-ai.name
		Type: easy
	ModularBot@NormalAI:
		Name: bot-normal-ai.name
		Type: normal
	ModularBot@HardAI:
		Name: bot-hard-ai.name
		Type: hard
	ModularBot@BrutalAI:
		Name: bot-brutal-ai.name
		Type: brutal
	# Difficulty levels reuse the classic personalities: Easy = defensive turtle with a weaker economy,
	# Normal = normal, Hard = rush, Brutal = rush with a stronger economy (refinery income, see structures.yaml).
	GrantConditionOnBotOwner@rush:
		Condition: enable-rush-ai
		Bots: hard, brutal
	GrantConditionOnBotOwner@normal:
		Condition: enable-normal-ai
		Bots: normal
	GrantConditionOnBotOwner@turtle:
		Condition: enable-turtle-ai
		Bots: easy
	GrantConditionOnBotOwner@naval:
		Condition: enable-naval-ai
		Bots: naval
	SupportPowerBotModule:
		RequiresCondition: (enable-rush-ai || enable-normal-ai || enable-turtle-ai || enable-naval-ai) && !treaty
		Decisions:
			spyplane:
				OrderName: SovietSpyPlane
				MinimumAttractiveness: 1
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: None
					CheckRadius: 5c0
			paratroopers:
				OrderName: SovietParatroopers
				MinimumAttractiveness: 5
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: None
					CheckRadius: 8c0
				Consideration@2:
					Against: Enemy
					Types: Water
					Attractiveness: -5
					TargetMetric: None
					CheckRadius: 8c0
			parabombs:
				OrderName: UkraineParabombs
				MinimumAttractiveness: 1
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: None
					CheckRadius: 5c0
			nukepower:
				OrderName: NukePowerInfoOrder
				MinimumAttractiveness: 3000
				Consideration@1:
					Against: Enemy
					Types: Structure
					Attractiveness: 1
					TargetMetric: Value
					CheckRadius: 5c0
				Consideration@2:
					Against: Ally
					Types: Air, Ground, Water
					Attractiveness: -10
					TargetMetric: Value
					CheckRadius: 7c0
