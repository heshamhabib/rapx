# IDEA-29 robot units: four Union robots and their four Vanguard counterparts (docs/DESIGN-IDEAS.md).
# Sprites: AI animation sheets -> artsrc/units/infantry/make_infantry.py (sequences/hd-infantry.yaml);
# weapons in weapons/robots.yaml, icons in sequences/robots.yaml, names in fluent/robots.ftl.
# Robots never take cover, can't be crushed, healed or eaten by dogs, and all deaths use their two drawn
# destruction sheets (make_infantry.py aliases die1 to die-crushed / die6).

^PxRobot:
	Inherits: ^Infantry
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	MustBeDestroyed:
	Armor:
		Type: Light
	-Crushable:
	-Targetable@HEAL:
	-EdibleByLeap:
	PxTreatyProtection:
		-Condition:
	WithInfantryBody:
		IdleSequences: idle1
		StandSequences: stand,stand2
		DefaultAttackSequence: shoot
	AttackFrontal:
		FacingTolerance: 0
	DeathSounds@NORMAL:
		DeathTypes: DefaultDeath, BulletDeath, SmallExplosionDeath, ExplosionDeath
		Voice: Die
	WithDeathAnimation:
		DeathTypes:
			DefaultDeath: 1
			BulletDeath: 1
			SmallExplosionDeath: 2
			ExplosionDeath: 2
			FireDeath: 1
			ElectricityDeath: 1
	-WithPxBlastDeath:

# Walker-sized robots: built at the War Factory, too big for transports (no transport carries Walker cargo)
^PxWalker:
	Inherits: ^PxRobot
	Armor:
		Type: Heavy
	Passenger:
		CargoType: Walker
	Selectable:
		Bounds: 1024, 1100, 0, -360
		DecorationBounds: 1024, 1250, 0, -440
	HitShape:
		Type: Circle
			Radius: 512

