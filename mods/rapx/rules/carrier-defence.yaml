# Layered carrier air defence (docs/DESIGN-IDEAS.md IDEA-08, carrier weapons step 1). Weapons: weapons/naval-defence.yaml.
# Outer layer NavalSAM (medium-range SAM), middle layer StingerAA (short-range missile, carriers.yaml), inner layer
# CIWSGun (gatling vs aircraft) plus PxPointDefense, which shoots down incoming missiles aimed at the ship.
# Point-defence gun mounts are generated into rules/carrier-decks.yaml. Counts and chances follow the real ships.

CV1:
	# Essex, WWII: no missiles; a wall of 40 mm Bofors flak, which can sometimes knock down a missile too.
	-Armament@AA1:
	Armament@FLAK1:
		Weapon: FlakGun
		LocalOffset: 512,400,0
	Armament@FLAK2:
		Weapon: FlakGun
		LocalOffset: -512,-400,0
		FireDelay: 8
	Armament@FLAK3:
		Weapon: FlakGun
		LocalOffset: 0,400,0
		FireDelay: 15
	PxPointDefense:
		Weapon: FlakTracer
		Range: 4c0
		Chance: 30
		AimTicks: 6
		ReloadDelay: 16

CV2:
