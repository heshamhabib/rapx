# IDEA-16 orbital laser mesh, phase 1 (+ the mesh from phase 2, via PxPrismRelay).
# Satellite Uplink (ground control) -> Launch Complex (builds satellites in the Aircraft tab) -> Laser Satellite.
# Satellites hover high above the map, can only be hit by ASAT weapons (TargetTypes: Satellite), fire straight
# down at enemies below them and link into a mesh: linked satellites within 12 cells feed each shot.
# Without a Satellite Uplink every satellite is offline (no shots, no links).
# Placeholder art: the Uplink borrows the Radar Dome, the Launch Complex the Missile Silo, the ASAT site the SAM.

SUPL:
	Inherits: ^Building
	Inherits@IDISABLE: ^DisableOnLowPowerOrPowerDown
	Inherits@shape: ^2x2Shape
	RenderSprites:
		Image: dome
	Selectable:
		Bounds: 2048, 2048
	Buildable:
		Queue: Building
		BuildPaletteOrder: 150
		Prerequisites: dome, techcenter, ~techlevel.high
		Description: actor-supl.description
	Valued:
		Cost: 2000
	Tooltip:
		Name: actor-supl.name
	Building:
		Footprint: xx xx ==
		Dimensions: 2,3
		LocalCenterOffset: 0,-512,0
	Health:
		HP: 90000
	Armor:
		Type: Wood
	RevealsShroud:
		MinRange: 5c0
		Range: 7c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 5c0
	WithPxBuildingPad:
	Power:
		Amount: -100
	ProvidesPrerequisite@buildingname:
	ProvidesPrerequisite@uplink:
		Prerequisite: uplink
		RequiresCondition: !disabled

LNCH:
	Inherits: ^Building
	Inherits@IDISABLE: ^DisableOnLowPowerOrPowerDown
	Inherits@shape: ^2x1Shape
	RenderSprites:
		Image: mslo
	Selectable:
		Bounds: 2048, 1024
	Buildable:
		Queue: Building
		BuildPaletteOrder: 155
		Prerequisites: supl, ~techlevel.high
		Description: actor-lnch.description
	Valued:
		Cost: 3000
	Tooltip:
		Name: actor-lnch.name
	Building:
		Footprint: xx
		Dimensions: 2,1
	Health:
		HP: 100000
	Armor:
		Type: Wood
	RevealsShroud:
		MinRange: 4c0
		Range: 5c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
	Exit@1:
		SpawnOffset: 0,0,0
		ExitCell: 0,0
		Facing: 512
	PxRallyPoint:
	RallyPoint:
	Production:
		Produces: Aircraft, Satellite
		PauseOnCondition: disabled
	ProductionBar:
		ProductionType: Aircraft
	Power:
		Amount: -150
	ProvidesPrerequisite@buildingname:

ASAT:
	Inherits: SAM
	RenderSprites:
		Image: sam
	Buildable:
		Queue: Defense
		BuildPaletteOrder: 110
		Prerequisites: supl, ~techlevel.high
		Description: actor-asat.description
	Valued:
		Cost: 1500
	Tooltip:
		Name: actor-asat.name
	Armament:
		Weapon: ASATMissile
	AutoTargetPriority@DEFAULT:
		ValidTargets: Satellite
	PxRenderRangeDome:
		Color: 7CE8FF
	Power:
		Amount: -50

LSAT:
	Inherits: ^Helicopter
	Inherits@AUTOTARGET: ^AutoTargetAll
	Buildable:
		Queue: Aircraft
		BuildAtProductionType: Satellite
		BuildPaletteOrder: 300
		Prerequisites: ~lnch, ~techlevel.high
		BuildLimit: 8
		Description: actor-lsat.description
	Valued:
		Cost: 2500
	Tooltip:
		Name: actor-lsat.name
		GenericName: actor-lsat.generic-name
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 20000
	Armor:
		Type: Light
	Aircraft:
		CruiseAltitude: 4c512
		Speed: 32
		TurnSpeed: 8
		IdleTurnSpeed: 2
		LandableTerrainTypes:
		Crushes:
		Repulsable: false
		CanForceLand: false
		IdleBehavior: None
	-GrantConditionOnDamageState@DAMAGED:
	Targetable@GROUND:
		TargetTypes: Satellite
	Targetable@AIRBORNE:
		TargetTypes: Satellite
	-Targetable@REPAIR:
	-Repairable:
	-EjectOnDeath:
	-Capturable:
	-CaptureNotification:
	-MustBeDestroyed:
	-SpawnActorOnDeath:
	RevealsShroud:
		Range: 6c512
		Type: GroundPosition
		RevealGeneratedShroud: False
	GrantConditionOnPrerequisite@UPLINK:
		Condition: uplinked
		Prerequisites: uplink
	Armament:
		Weapon: OrbitalLaser
		LocalOffset: 0,0,-256
		PauseOnCondition: !uplinked || prism-feeding
	AttackAircraft:
		AttackType: Hover
		FacingTolerance: 512
		PersistentTargeting: false
		OpportunityFire: true
	AutoTarget:
		AllowMovement: false
		AllowTurning: false
		InitialStance: Defend
		InitialStanceAI: Defend
	PxPrismRelay:
		RequiresCondition: uplinked
		Group: orbital
		LinkRange: 12c0
		RelayWeapon: OrbitalRelayBeam
		FeedingDuration: 100
		BeamOffset: 0,0,-256
	Selectable:
		DecorationBounds: 1536, 1280
