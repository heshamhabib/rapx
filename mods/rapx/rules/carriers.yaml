# Aircraft carriers (docs/DESIGN-IDEAS.md IDEA-08 2a/2b). Phase 1: big anti-air ships, each nation only builds its own
# (USA: the four-tier era ladder CV1-CV4; the other nations with carriers in real life: one each). Aircraft on
# deck (slots, take-off, landing, building on board) come with IDEA-06/08.
# Art: artsrc/units/meshes/make_sketchfab.py <id> (sequences/carriers.yaml). Allied ones are built at the Naval
# Yard, Vanguard ones at the Sub Pen.

# Nation prerequisites for the naval buildings (ships.england/france/russia/sovietvanilla exist already)
SYRD:
	ProvidesPrerequisite@carrierusa:
		Factions: usa
		Prerequisite: ships.usa
	ProvidesPrerequisite@carrierjapan:
		Factions: japan
		Prerequisite: ships.japan
	ProvidesPrerequisite@carrieritaly:
		Factions: italy
		Prerequisite: ships.italy
	ProvidesPrerequisite@carrieregypt:
