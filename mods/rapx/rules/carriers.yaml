# Carrier air wings (IDEA-08 2c, A1 launch and recovery cycles). Flight decks: rules/carrier-decks.yaml (generated).
# Only naval jets land on carriers, by deck kind: Catapult (CATOBAR: Nimitz, Ford, Charles de Gaulle, Fujian),
# SkiJump (STOBAR: Kuznetsov, Vikrant, Fujian) and STOVL (any deck: Harrier, Yak-141 and the Turkish drone swarm).
# Su-27/Su-35 stand in for the Su-33 / J-15 sea Flankers. Right-click your carrier with these jets to rebase them.
JET.F4:
	PxCarrierJet:
		DeckTypes: Catapult

JET.F14:
	PxCarrierJet:
		DeckTypes: Catapult

JET.X47:
	PxCarrierJet:
		DeckTypes: Catapult

JET.SEAVIXEN:
	PxCarrierJet:
		DeckTypes: Catapult

JET.RAFALE:
	PxCarrierJet:
		DeckTypes: Catapult, SkiJump

JET.SU27:
	PxCarrierJet:
		DeckTypes: SkiJump

JET.SU35:
	PxCarrierJet:
		DeckTypes: SkiJump

JET.HARRIER:
	PxCarrierJet:
		DeckTypes: STOVL

JET.YAK141:
	PxCarrierJet:
		DeckTypes: STOVL

JET.SWARM:
	PxCarrierJet:
		DeckTypes: STOVL
