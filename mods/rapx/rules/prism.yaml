# Allied prism weapons: the Prism Tank and the Prism Tower.
# Prism Towers relay their beams (PxPrismRelay): when one fires, every linked ready tower within 6 cells
# (chained) beams its energy into it for +40 % damage each (max +200 %) and pauses its own attack meanwhile.

PTNK:
	Inherits: ^TrackedVehicle
	Inherits@GAINSEXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 235
		Prerequisites: atek, ~vehicles.allies, ~techlevel.high
		Description: actor-ptnk.description
	Valued:
		Cost: 1200
	Tooltip:
		Name: actor-ptnk.name
		GenericName: actor-ptnk.generic-name
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 32000
	Armor:
		Type: Light
	Mobile:
		Speed: 64
	RevealsShroud:
		MinRange: 4c0
		Range: 7c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
	Turreted:
		TurnSpeed: 16
		# Cyber Tank turret ring (artsrc/units/meshes/import_sketchfab.py prints these)
		Offset: -446,1,0
	Armament:
		Weapon: PrismTankBeam
		# Beam leaves the turret gun's muzzle
		LocalOffset: 338,0,492
	AttackTurreted:
	WithSpriteTurret:
	ProducibleWithLevel:
		Prerequisites: vehicles.upgraded
	Selectable:
		DecorationBounds: 1672, 1672
	WithProductionIconOverlay:
		Types: Veterancy
		Prerequisites: vehicles.upgraded

PTWR:
	Inherits: ^Defense
	Inherits@IDISABLE: ^DisableOnLowPowerOrPowerDown
	Inherits@AUTOTARGET: ^AutoTargetGround
	Buildable:
		Queue: Defense
		BuildPaletteOrder: 75
		Prerequisites: dome, ~structures.allies, ~techlevel.medium
		Description: actor-ptwr.description
	Valued:
		Cost: 1500
	Tooltip:
		Name: actor-ptwr.name
	Selectable:
		Bounds: 1024, 1024
		DecorationBounds: 1024, 3800, 0, -1300
	Health:
		HP: 40000
	Armor:
		Type: Heavy
	RevealsShroud:
		MinRange: 6c0
		Range: 8c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 6c0
	Armament:
		Weapon: PrismTowerBeam
		LocalOffset: 0,0,2700
	AttackOmni:
		PauseOnCondition: disabled || build-incomplete || prism-feeding
	GrantConditionOnAttack@FIRING:
		Condition: prism-firing
		RevokeDelay: 25
	# Living tower (IDEA-22 style): the crystal crown floats above its collar (sprite split by build_all.py FLOAT_TOP)
	# and rises while charging; energy cushion, orbiting rings, rising motes, crystal glints, base lights, and arcs
	# around the crown while it fires or feeds another tower. Everything rests on low power.
	WithPxFloatingOverlay:
		RequiresCondition: !build-incomplete
		PauseOnCondition: disabled
		ChargeCondition: prism-firing || prism-feeding
		Hover: 1.5
		Bob: 0.8
	WithPxBuildingFx@cushion:
		RequiresCondition: !disabled && !build-incomplete
		Type: Pulse
		Offset: 2.5,-47
		Color: 7FE8FF
		Size: 0.9
		Period: 40
		MinAlpha: 0.35
		MaxAlpha: 0.85
	WithPxBuildingFx@aura:
		RequiresCondition: !disabled && !build-incomplete
		Type: Pulse
		Offset: 2.5,-60
		Color: A8F0FF
		Size: 2.2
		Period: 70
		MinAlpha: 0.12
		MaxAlpha: 0.38
	WithPxBuildingFx@glints:
		RequiresCondition: !disabled && !build-incomplete
		Type: Glints
		Offset: 2.5,-61
		Radius: 9,6
		Color: FFFFFF
		Size: 0.35
		Rate: 6
		Life: 10
	WithPxBuildingFx@ring1:
		RequiresCondition: !disabled && !build-incomplete
		Type: Orbit
		Offset: 2.5,-33
		Radius: 7,2.4
		Color: 6FE0FF
		Size: 0.5
		Period: 45
		MinAlpha: 0.1
		MaxAlpha: 0.9
	WithPxBuildingFx@ring2:
		RequiresCondition: !disabled && !build-incomplete
		Type: Orbit
		Offset: 2.5,-19
		Radius: 7,2.4
		Color: 6FE0FF
		Size: 0.5
		Period: 62
		Phase: 31
		MinAlpha: 0.1
		MaxAlpha: 0.9
	WithPxBuildingFx@motes:
		RequiresCondition: !disabled && !build-incomplete
		Type: Motes
		Offset: 2.5,-6
		Radius: 3,0.5
		Color: 9FEFFF
		Size: 0.22
		Rate: 5
		Life: 70
		MaxAlpha: 0.85
	WithPxBuildingFx@baseleft:
		RequiresCondition: !disabled && !build-incomplete
		Type: Blink
		Offset: -6,8
		Color: 9FEFFF
		Size: 0.35
		Period: 60
		Phase: 0
	WithPxBuildingFx@baseright:
		RequiresCondition: !disabled && !build-incomplete
		Type: Blink
		Offset: 11,8
		Color: 9FEFFF
		Size: 0.35
		Period: 60
		Phase: 30
	WithPxBuildingFx@chargearcs:
		RequiresCondition: !disabled && (prism-firing || prism-feeding)
		Type: Arcs
		Offset: 2.5,-62
		Radius: 10,7
		Color: BFF4FF
		Size: 0.6
		Rate: 3
	WithPxBuildingFx@chargeglow:
		RequiresCondition: !disabled && (prism-firing || prism-feeding)
		Type: Pulse
		Offset: 2.5,-63
		Color: D8FAFF
		Size: 3.2
		Period: 12
		MinAlpha: 0.45
		MaxAlpha: 1
	PxPrismRelay:
		RequiresCondition: !disabled && !build-incomplete
		RelayWeapon: PrismRelayBeam
		LinkRange: 6c0
		BeamOffset: 0,0,2700
	Power:
		Amount: -75
	ProvidesPrerequisite@buildingname:
