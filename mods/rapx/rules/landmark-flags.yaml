# Nation flags on captured landmarks (^PxCashLandmark in civilian.yaml): the owner's national flag beside the
# landmark, with a player-colour pennant and plinth band. Sprites: artsrc/landmark-flag/ (hd-landmark-flag.yaml).
# Offsets are world (east, south) cells of the pole's foot from the capture point, written as local (-south, east).

^PxLandmarkFactions:
	GrantConditionOnFaction@allies:
		Condition: flag-allies
		Factions: allies
		ResetOnOwnerChange: true
	GrantConditionOnFaction@usa:
		Condition: flag-usa
		Factions: usa
		ResetOnOwnerChange: true
	GrantConditionOnFaction@england:
		Condition: flag-england
		Factions: england
		ResetOnOwnerChange: true
	GrantConditionOnFaction@france:
		Condition: flag-france
		Factions: france
		ResetOnOwnerChange: true
	GrantConditionOnFaction@germany:
		Condition: flag-germany
		Factions: germany
		ResetOnOwnerChange: true
	GrantConditionOnFaction@japan:
