# National rocket launchers (IDEA-17, phase A1): one launcher per nation, built at the War Factory with a Radar Dome.
# Soviet nations keep the V2RL and Allied nations keep the Artillery next to their launcher.
# Art: each launcher has its own model (phase 3): 6 shared Sketchfab chassis in national paint.
# Weapons: weapons/rocket-launchers.yaml.

WEAP:
	ProvidesPrerequisite@rl.usa:
		Factions: usa
		Prerequisite: rocketlauncher.usa
	ProvidesPrerequisite@rl.england:
		Factions: england
		Prerequisite: rocketlauncher.england
	ProvidesPrerequisite@rl.france:
		Factions: france
		Prerequisite: rocketlauncher.france
	ProvidesPrerequisite@rl.germany:
		Factions: germany
		Prerequisite: rocketlauncher.germany
	ProvidesPrerequisite@rl.italy:
		Factions: italy
		Prerequisite: rocketlauncher.italy
	ProvidesPrerequisite@rl.turkey:
		Factions: turkey
		Prerequisite: rocketlauncher.turkey
	ProvidesPrerequisite@rl.pakistan:
		Factions: pakistan
		Prerequisite: rocketlauncher.pakistan
	ProvidesPrerequisite@rl.japan:
		Factions: japan
		Prerequisite: rocketlauncher.japan
	ProvidesPrerequisite@rl.southkorea:
		Factions: southkorea
		Prerequisite: rocketlauncher.southkorea
	ProvidesPrerequisite@rl.russia:
		Factions: russia
		Prerequisite: rocketlauncher.russia
	ProvidesPrerequisite@rl.ukraine:
		Factions: ukraine
		Prerequisite: rocketlauncher.ukraine
	ProvidesPrerequisite@rl.cuba:
		Factions: cuba
		Prerequisite: rocketlauncher.cuba
	ProvidesPrerequisite@rl.india:
		Factions: india
		Prerequisite: rocketlauncher.india
	ProvidesPrerequisite@rl.egypt:
		Factions: egypt
		Prerequisite: rocketlauncher.egypt
	ProvidesPrerequisite@rl.china:
		Factions: china
		Prerequisite: rocketlauncher.china
	ProvidesPrerequisite@rl.iran:
		Factions: iran
		Prerequisite: rocketlauncher.iran

^PxRocketLauncher:
	Inherits@GAINSEXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 231
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Armor:
		Type: Light
	RevealsShroud:
		MinRange: 4c0
		Range: 5c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
	AttackFrontal:
		TargetFrozenActors: True
		ForceFireIgnoresActors: True
		FacingTolerance: 0
	FireWarheadsOnDeath:
		Weapon: V2Explode
	ProducibleWithLevel:
		Prerequisites: vehicles.upgraded
	WithProductionIconOverlay:
		Types: Veterancy
		Prerequisites: vehicles.upgraded
	Selectable:
		DecorationBounds: 1672, 1672

# Wheeled launcher: its own model (sequences/rocket-launchers.yaml rl-<actor>); rockets leave from its pods / tubes,
# which stay on the vehicle. Armament LocalOffset = the pods (estimated from the model: forward ~175, height ~134
# world units per model unit, artsrc/units/meshes/sketchfab_models.py LAUNCHER_CHASSIS).
^PxRocketTruck:
	Inherits: ^Vehicle
	Inherits@RL: ^PxRocketLauncher
	Health:
		HP: 20000
	Mobile:
		Speed: 72

# Tracked launcher: its own model
^PxRocketTracked:
	Inherits: ^TrackedVehicle
	Inherits@RL: ^PxRocketLauncher
	Health:
		HP: 24000
	Mobile:
		TurnSpeed: 8
		Speed: 64
		Locomotor: lighttracked
	Armament:
		LocalOffset: -210,0,295

HIMAX:
	Inherits: ^PxRocketTruck
	Buildable:
		Prerequisites: dome, ~rocketlauncher.usa, ~techlevel.medium
		Description: actor-himax.description
	Valued:
		Cost: 1300
	Tooltip:
		Name: actor-himax.name
	Health:
		HP: 18000
	Mobile:
		Speed: 99
	Armament:
		LocalOffset: -280,0,375
		Weapon: RL_HIMAX
	PxShootAndScoot:
