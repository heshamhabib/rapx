							Y: 26
							Width: 352
							Height: 32
							Font: Bold
							Children:
								LogicKeyListener@SHROUD_KEYHANDLER:
								Image@FLAG:
									X: 8
									Y: 8
									Width: 32
									Height: 16
								Label@LABEL:
									X: 46
									Width: PARENT_WIDTH
									Height: 32
									Shadow: True
								Label@NOFLAG_LABEL:
									X: 10
									Width: PARENT_WIDTH
									Height: 32
									Shadow: True
				Label@CARDS_LABEL:
					X: 20
					Y: 474
					Width: 200
					Height: 16
					Font: PXSidebarSmall
					TextColor: 9D9EA6
					Text: label-px-observer-players
				PxObserverPlayers@PLAYER_CARDS:
					X: 18
					Y: 494
					Width: 368
					Height: WINDOW_HEIGHT - 494 - 12
				Background@REPLAY_PLAYER:
					Logic: ReplayControlBarLogic
					X: 18
					Y: WINDOW_HEIGHT - HEIGHT - 12
					Width: 368
					Height: 52
					Background: px-well
					Visible: false
					Children:
						Button@BUTTON_PAUSE:
							X: 8
							Y: 8
							Width: 44
							Height: 36
							Background: px-key
							Key: Pause
							TooltipText: button-observer-widgets-pause-tooltip
							TooltipContainer: TOOLTIP_CONTAINER
							VisualHeight: 0
							Children:
								Image@IMAGE_PAUSE:
									X: 14
									Y: 10
									ImageCollection: music
									ImageName: pause
						Button@BUTTON_PLAY:
							X: 8
							Y: 8
							Width: 44
							Height: 36
							Background: px-key
							Key: Pause
							TooltipText: button-observer-widgets-play-tooltip
							TooltipContainer: TOOLTIP_CONTAINER
							VisualHeight: 0
							Children:
								Image@IMAGE_PLAY:
									X: 14
									Y: 10
									ImageCollection: music
									ImageName: play
						Button@BUTTON_SLOW:
							X: 60
							Y: 8
							Width: 72
							Height: 36
							Background: px-key
							Key: ReplaySpeedSlow
							TooltipText: button-observer-widgets-slow.tooltip
							TooltipContainer: TOOLTIP_CONTAINER
							VisualHeight: 0
							Text: button-observer-widgets-slow.label
							Font: PXSidebarSmall
						Button@BUTTON_REGULAR:
							X: 136
							Y: 8
							Width: 72
							Height: 36
							Background: px-key
							Key: ReplaySpeedRegular
							TooltipText: button-observer-widgets-regular.tooltip
							TooltipContainer: TOOLTIP_CONTAINER
							VisualHeight: 0
							Text: button-observer-widgets-regular.label
							Font: PXSidebarSmall
						Button@BUTTON_FAST:
							X: 212
							Y: 8
							Width: 72
							Height: 36
							Background: px-key
							Key: ReplaySpeedFast
							TooltipText: button-observer-widgets-fast.tooltip
							TooltipContainer: TOOLTIP_CONTAINER
							VisualHeight: 0
							Text: button-observer-widgets-fast.label
							Font: PXSidebarSmall
						Button@BUTTON_MAXIMUM:
							X: 288
							Y: 8
							Width: 72
							Height: 36
							Background: px-key
							Key: ReplaySpeedMax
							TooltipText: button-observer-widgets-maximum.tooltip
							TooltipContainer: TOOLTIP_CONTAINER
							VisualHeight: 0
							Text: button-observer-widgets-maximum.label
							Font: PXSidebarSmall
		Container@HPF_ROOT:
			Logic: LoadIngameHierarchicalPathFinderOverlayLogic
			X: WINDOW_WIDTH - WIDTH - 415
			Y: 40
			Width: 175
