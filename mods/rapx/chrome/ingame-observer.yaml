Container@OBSERVER_WIDGETS:
	Logic: LoadIngameChatLogic
	Children:
		Container@CHAT_ROOT:
		Container@MUTE_INDICATOR:
			Logic: MuteIndicatorLogic
			X: WINDOW_WIDTH - WIDTH - 420
			Y: 10
			Width: 200
			Height: 25
			Children:
				Image@ICON:
					X: PARENT_WIDTH - WIDTH
					Y: 1
					Width: 24
					Height: 24
					ImageCollection: sidebar-bits
					ImageName: indicator-muted
				Label@LABEL:
					Width: PARENT_WIDTH - 30
					Height: 25
					Align: Right
					Text: label-mute-indicator
					Contrast: true
		Background@PX_OBSERVER_SIDEBAR:
			Logic: PxObserverSidebarLogic
			X: WINDOW_WIDTH - WIDTH
			Width: 400
			Height: WINDOW_HEIGHT
			Background: px-sidebar-bg
			ClickThrough: false
			Children:
				Image@FACTION_EMBLEM:
					X: 18
					Y: 10
					Width: 44
					Height: 44
					ImageCollection: px-emblems
					ImageName: allies
				Label@OBSERVER_TITLE:
					X: 72
					Y: 11
					Width: 240
					Height: 24
					Font: PXSidebarTitle
					Text: label-px-observer-title
				Label@OBSERVER_SUBTITLE:
					X: 72
					Y: 35
					Width: 240
					Height: 16
					Font: PXSidebarSmall
					TextColor: FF6A55
				Container@TOP_BUTTONS:
					Logic: MenuButtonsChromeLogic
					X: 342
					Y: 10
					Width: 44
					Height: 44
					Children:
						LogicKeyListener@OBSERVER_KEY_LISTENER:
						MenuButton@OPTIONS_BUTTON:
							Width: 44
							Height: 44
							Background: px-key
							Key: escape
							TooltipText: button-top-buttons-options-tooltip
							TooltipContainer: TOOLTIP_CONTAINER
							DisableWorldSounds: true
							VisualHeight: 0
							Children:
								Image@ICON:
									X: 10
									Y: 10
									ImageCollection: px-order-icons
									ImageName: options
				Background@WEATHER_WELL:
					X: 18
					Y: 62
					Width: 368
					Height: 48
					Background: px-well
					Children:
						PxWeatherBadge@WEATHER_BADGE:
							Width: 368
							Height: 48
							TooltipContainer: TOOLTIP_CONTAINER
				Background@RADAR_WELL:
					X: 18
					Y: 118
					Width: 368
					Height: 214
					Background: px-well
					Children:
						Image@RADAR_ICON:
							X: 10
							Y: 8
							ImageCollection: px-sidebar-bits
							ImageName: radar
						Label@RADAR_LABEL:
							X: 30
							Y: 5
							Width: 100
							Height: 20
							Font: PXSidebarSmall
							TextColor: C8C8CF
							Text: label-px-sidebar-radar
						ColorBlock@RADAR_DOT:
							X: 314
							Y: 12
							Width: 7
							Height: 7
							Color: 5DFF7A
						Label@RADAR_STATUS:
							X: 326
							Y: 5
							Width: 36
							Height: 20
							Font: PXDigitsSmall
							TextColor: 5DFF7A
							Text: label-px-observer-live
						Container@RADAR:
							X: 6
							Y: 26
							Width: 356
							Height: 182
							Children:
								ColorBlock:
									Width: 356
									Height: 182
									Color: 000000
								Radar@INGAME_RADAR:
									WorldInteractionController: INTERACTION_CONTROLLER
									Width: 356
									Height: 182
								VideoPlayer@PLAYER:
									Width: 356
									Height: 182
									Skippable: false
				Background@TIME_WELL:
					X: 18
					Y: 340
					Width: 214
					Height: 52
					Background: px-well
					Children:
						Label@TIME_LABEL:
							X: 12
							Y: 5
							Width: 190
							Height: 14
							Font: PXSidebarSmall
							TextColor: 9D9EA6
							Text: label-px-sidebar-time
						LabelWithTooltip@GAME_TIMER:
							Logic: GameTimerLogic
							X: 12
							Y: 18
							Width: 190
							Height: 30
							Font: PXDigits
							TooltipContainer: TOOLTIP_CONTAINER
							TooltipTemplate: SIMPLE_TOOLTIP
				Background@ALIVE_WELL:
					X: 238
					Y: 340
					Width: 148
					Height: 52
					Background: px-well
					Children:
						Label@ALIVE_LABEL:
							X: 12
							Y: 5
							Width: 130
							Height: 14
							Font: PXSidebarSmall
							TextColor: 9D9EA6
							Text: label-px-observer-alive
						Label@PLAYERS_ALIVE:
							X: 12
							Y: 18
							Width: 130
							Height: 30
							Font: PXDigits
				Background@VIEW_WELL:
					X: 18
					Y: 400
					Width: 368
					Height: 66
