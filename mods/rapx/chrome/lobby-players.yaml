# "Choose your titan" (PxTitanPickerPanel): big banner cards for the titans, a slim row for None and Random. PxTitanDecor
# draws each card from its PORTRAIT id; LABEL only carries the name.
PxTitanPickerPanel@TITAN_DROPDOWN_TEMPLATE:
	Width: 640
	Background: px-lobby-frame
	ScrollBar: Hidden
	TopBottomSpacing: 0
	Children:
		ScrollItem@TEMPLATE:
			Background:
			Width: 300
			Height: 120
			Visible: false
			Children:
				Image@PORTRAIT:
					ImageCollection: px-titans
					Width: 1
					Height: 1
					Visible: false
				Label@LABEL:
					Width: 1
					Height: 1
					Visible: false
				PxTitanDecor@DECOR:
					Mode: Card
					PortraitSize: 60, 40
					Width: 1
					Height: 1
