# --- Guns: hit aircraft and ground ---------------------------------------------------------------------------------
JetGun.M61:
	Inherits: ^HeavyMG
	Burst: 6
	BurstDelays: 2
	ReloadDelay: 40
	Range: 4c512
	MinRange: 0c768
	ValidTargets: Ground, Water, GroundActor, WaterActor, AirborneActor
	Report: ra|audio/weapons/vulcan-burst1.wav, ra|audio/weapons/vulcan-burst2.wav, ra|audio/weapons/vulcan-burst3.wav
	Projectile: PxTracer
		Rounds: 1
		Speed: 2200
		Width: 22
		TracerLength: 640
		MuzzleFlare: 220
		Inaccuracy: 260
	Warhead@1Dam: SpreadDamage
		Damage: 1300
		ValidTargets: GroundActor, WaterActor, AirborneActor
		Versus:
			None: 120
			Wood: 50
			Light: 30
			Heavy: 25
			Concrete: 20

# GAU-8 Avenger (A-10): 30 mm armour-piercing, the tank killer
JetGun.GAU8:
	Inherits: JetGun.M61
	Burst: 8
	BurstDelays: 1
	ReloadDelay: 30
	Range: 5c0
	Projectile: PxTracer
		Width: 30
		TracerLength: 720
		MuzzleFlare: 300
	Warhead@1Dam: SpreadDamage
		Spread: 160
		Damage: 3200
		Versus:
			None: 90
			Wood: 70
			Light: 45
			Heavy: 120
			Concrete: 45
	Warhead@3Eff: PxExplosion
		Size: 0.35
		ValidTargets: Ground, GroundActor, WaterActor, Trees

# 23/30 mm Soviet and European guns: harder hitting, slower than the M61
JetGun.GSh30:
	Inherits: JetGun.M61
	Burst: 4
	BurstDelays: 3
	Warhead@1Dam: SpreadDamage
		Damage: 2000
		Versus:
			Heavy: 40
