# White phosphorus bombs: the bomb opens high over the target in a white puff and throws a wide fan of burning pieces
# that arch out and fall slowly, each white-hot with a long trail of thick white smoke and glittering sparks (the
# "jellyfish" of a real air burst). Where they land the ground keeps burning with white smoke (PxBurn: JetWP.Burn
# every second for ~12 s), hurting infantry and light vehicles standing in it.
JetWP:
	Inherits: JetCluster
	ReloadDelay: 20
	Report: ra|audio/sfx/chute1.ogg
	Projectile: PxRocket
		BurstHeight: 1500
	Warhead@Cluster: FireCluster
		Weapon: JetWP.Piece
		RandomClusterCount: 30
		Dimensions: 7,7
		Footprint: __xxx__ _xxxxx_ xxxxxxx xxxxxxx xxxxxxx _xxxxx_ __xxx__
	Warhead@Burst: PxExplosion
		AirVideo: white-phosphorus-1
		Video: white-phosphorus-1
		Style: HitToKill
		Size: 1.0
		Smoke: 1.5
		Scorch: false
		Shake: false
		Wave: false
		Throw: false
		ImpactSounds: ra|audio/weapons/sam/gurz-burst2.ogg
	-Warhead@CarpetVid:

JetWP.Pair:
	Inherits: JetWP
	Burst: 2
	BurstDelays: 6

