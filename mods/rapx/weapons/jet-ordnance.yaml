			Wood: 60
			Tree: 80
			Light: 50
			Heavy: 10
			Concrete: 10
		DamageTypes: Prone50Percent, TriggerProne, FireDeath, Incendiary
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Scorch
		Chance: 40
		ValidTargets: Ground
	Warhead@3Eff: PxFire
