		Length: 190
		Width: 26
	Warhead@1Dam: SpreadDamage
		Spread: 256
		Damage: 2200
		Versus:
			None: 100
			Wood: 60
			Light: 80
			Heavy: 35
			Concrete: 30
	Warhead@3Eff: PxExplosion
		Size: 0.7
JetRockets.Pair:
