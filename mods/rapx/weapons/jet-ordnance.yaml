# IDEA-34 jet loadouts: the weapons jets carry on their stations (artsrc/jets/loadout_table.py). Each family has a
# single version (centreline station) and a .Pair version (left + right pylon, fired left then right; one ammo each,
# so each missile leaves its own pylon and disappears from the sprite). Rules: rules/jet-loadouts.yaml (generated).
# Air-to-air missiles and guns hit aircraft too: jets fight jets.

# --- Air-to-air ---------------------------------------------------------------------------------------------------
# Short range (AIM-9, R-73): agile, accurate, close in
JetAAM.Short:
	Inherits: ^AntiAirMissile
	ReloadDelay: 60
	Range: 6c0
	MinRange: 0c512
	Report: ra|audio/sfx/missile1.ogg
	Projectile: PxRocket
		Image: pxmissile
		Sequence: aim9
		Speed: 540
		Arc: 0.02
		Length: 540
		Width: 34
	Warhead@1Dam: SpreadDamage
		Damage: 5200
		Versus:
			None: 100
			Light: 80
			Heavy: 70
JetAAM.Short.Pair:
	Inherits: JetAAM.Short
	Burst: 2
	BurstDelays: 8

# Medium range (AIM-120, R-77): fired from far away, a little less deadly
JetAAM.Medium:
	Inherits: JetAAM.Short
	ReloadDelay: 80
	Range: 10c0
	MinRange: 1c512
	Projectile: PxRocket
		Image: pxmissile
		Sequence: aim120
		Speed: 460
		Length: 640
		Width: 38
	Warhead@1Dam: SpreadDamage
		Damage: 4600
JetAAM.Medium.Pair:
	Inherits: JetAAM.Medium
	Burst: 2
	BurstDelays: 10

# Long range (AIM-54 Phoenix, R-33/R-40): the longest reach, heavy warhead, hits bombers hard
JetAAM.Long:
	Inherits: JetAAM.Short
	ReloadDelay: 110
	Range: 14c0
	MinRange: 3c0
	Projectile: PxRocket
		Image: pxmissile
		Sequence: aim54
		Speed: 400
		Length: 700
		Width: 46
	Warhead@1Dam: SpreadDamage
		Damage: 7500
		Versus:
			Heavy: 110
	Warhead@3Eff: PxExplosion
		Size: 1.1
JetAAM.Long.Pair:
	Inherits: JetAAM.Long
	Burst: 2
	BurstDelays: 14

# --- Air-to-ground --------------------------------------------------------------------------------------------------
# Air-to-ground missile (AGM-65 Maverick, Kh-25): tanks and vehicles
JetAGM:
	Inherits: Maverick
	Burst: 1
	ReloadDelay: 35
	Projectile: PxRocket
		Image: pxmissile
		Sequence: agm65
		Length: 450

JetAGM.Pair:
	Inherits: JetAGM
	Burst: 2
	BurstDelays: 7

# Unguided bombs (Mk 82, FAB): must fly close, big splash
JetBomb:
	Inherits: ^AntiGroundMissile
	ReloadDelay: 12
	Range: 2c512
	MinRange: 0c0
	Report: ra|audio/sfx/chute1.ogg
	Projectile: PxRocket
		Image: pxmissile
		Sequence: mk82
		Speed: 170
		Arc: 0.45
		Length: 390
		Width: 60
	Warhead@1Dam: SpreadDamage
		Spread: 512
		Damage: 9000
		Versus:
			None: 70
			Wood: 100
			Light: 90
			Heavy: 70
			Concrete: 70
	Warhead@3Eff: PxExplosion
		Video: bomb-1, bomb-2
		Size: 1.5
		ImpactSounds: ra|audio/sfx/kaboom15.ogg
JetBomb.Pair:
	Inherits: JetBomb
	Burst: 2
	BurstDelays: 4

# Napalm (Mk 77 / ZAB): an unguided fire bomb that bursts into a ring of sticky burning fuel (the filmed napalm-a
# clip) and keeps burning (fire-big-b loop) for ~9 s, burning infantry and light vehicles standing in it (PxBurn:
# JetNapalm.Burn every second). Weak against tanks and concrete.
JetNapalm:
	Inherits: JetBomb
	Report: ra|audio/sfx/chute1.ogg
	Warhead@1Dam: SpreadDamage
		Spread: 640
		Damage: 6000
		Versus:
			None: 100
			Wood: 100
			Light: 70
			Heavy: 25
			Concrete: 30
		DamageTypes: Prone50Percent, TriggerProne, FireDeath, Incendiary
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Scorch
		ValidTargets: Ground
	Warhead@3Eff: PxFire
		Size: 1.4
		Duration: 220
		Video: napalm-1
		BurnVideo: fire-big-loop-1
		BurnVideoEnd: fire-big-end
		VideoScale: 0.9
		ImpactSounds: ra|audio/sfx/firebl3.ogg
		ValidTargets: Ground, GroundActor, Trees
	Warhead@Burn: PxBurn
		Weapon: JetNapalm.Burn
		Duration: 225
		Interval: 25
		ValidTargets: Ground, GroundActor, Trees
JetNapalm.Pair:
	Inherits: JetNapalm
	Burst: 2
	BurstDelays: 4
JetNapalm.Burn:
	Inherits: JetWP.Burn
	-Warhead@3Eff:

# Guided bombs (GBU-12/31, KAB-500): precise, heavy, best against buildings
JetGBU:
	Inherits: JetBomb
	ReloadDelay: 40
	Range: 5c0
	Projectile: PxRocket
		Image: pxmissile
		Sequence: gbu
		Length: 590
		Speed: 230
		Arc: 0.25
	Warhead@1Dam: SpreadDamage
		Spread: 256
		Damage: 15000
		Versus:
			None: 40
			Wood: 120
			Light: 90
			Heavy: 100
			Concrete: 120
JetGBU.Pair:
	Inherits: JetGBU
	Burst: 2
	BurstDelays: 10

# Cluster bombs (CBU-87, RBK-500, BL755): the dispenser falls like a bomb, opens high over the target with a pop and a
# puff (PxRocket BurstHeight), and its FireCluster warhead throws burning bomblets down from there: they rain with
# glowing streaks and glittering sparks and land as a carpet of small blasts. Strong against infantry and light
# vehicles over an area, weak against tanks and buildings.
JetCluster:
	Inherits: JetBomb
	ReloadDelay: 14
	Range: 3c0
	Projectile: PxRocket
		Image: pxmissile
		Sequence: mk82
		Speed: 150
		Arc: 0.04
		LaunchEase: 0.5
		Unpowered: true
		LaunchPuffs: 0
		TrailLife: 30
		BurstHeight: 900
	-Warhead@1Dam:
	-Warhead@2Smu:
	-Warhead@3Eff:
	-Warhead@4EffWater:
	Warhead@Cluster: FireCluster
		Weapon: JetCluster.Bomblet
		RandomClusterCount: 26
		Dimensions: 5,5
		Footprint: _xxx_ xxxxx xxxxx xxxxx _xxx_
	# The carpet of bomblet pops, filmed (artsrc/fx/make_video_fx.py), under the dispenser as the bomblets land
	Warhead@CarpetVid: PxVideo
		Video: cluster-1
		Scale: 0.9
		Delay: 14
		ValidTargets: Ground, GroundActor, Trees

JetCluster.Pair:
	Inherits: JetCluster
	Burst: 2
	BurstDelays: 4

JetCluster.Bomblet:
	Range: 3c0
	ValidTargets: Ground, Water, GroundActor, WaterActor
	Report: ra|audio/weapons/sam/gurz-burst1.ogg
	Projectile: PxRocket
		Interceptable: false
		TrackTarget: false
		DrawBody: false
		Speed: 75
		Arc: 0.03
		LaunchEase: 0.4
		Inaccuracy: 0c448
		Length: 60
		Width: 26
		FlameColor: FFC873
		FlameSize: 0.9
		FirePlume: 0
		TrailDensity: 0
		LaunchPuffs: 0
		Sparkle: 2
		StreakLife: 14
		StreakColor: FFBE78
		StreakWidth: 8
	Warhead@1Dam: SpreadDamage
		Spread: 320
		Damage: 700
		Falloff: 100, 50, 20, 5
		ValidTargets: GroundActor, WaterActor
		Versus:
			None: 100
			Wood: 30
			Light: 75
			Heavy: 20
			Concrete: 15
		DamageTypes: Prone50Percent, TriggerProne, SmallExplosionDeath
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Scorch
		Chance: 30
		ValidTargets: Ground
	Warhead@3Eff: PxExplosion
		Style: Bomblet
		Size: 0.9
		ImpactSounds: ra|audio/sfx/kaboom12.ogg, ra|audio/sfx/kaboom15.ogg
		ValidTargets: Ground, GroundActor, WaterActor, Trees
	Warhead@4EffWater: CreateEffect
		Explosions: vsplash-1, vsplash-2
		ValidTargets: Water, Underwater

# Rocket pods (Hydra 70, S-8): a salvo per pod, wide spread, infantry and light vehicles
