# Long-range shells (howitzer, naval guns): ^Artillery's damage and effects, but flown as an HD shell
# (OpenRA.Mods.RAPX/Projectiles/PxRocket.cs) with a fire and smoke trail instead of a contrail line.
# Standalone (not inheriting ^Cannon) so no Bullet-only fields reach the PxRocket projectile.
^ArtilleryShell:
	ReloadDelay: 85
	Range: 12c0
	Report: ra|audio/sfx/cannon1.ogg
	ValidTargets: Ground, Water, GroundActor, WaterActor
	Projectile: PxRocket
		Speed: 204
		Inaccuracy: 1c938
		Interceptable: false
		ThreatType: Shell
		TrackTarget: false
		Arc: 0.3
		Length: 70
		Width: 34
		BodyColor: 3C3A36
		NoseColor: 8C7A5A
		FlameColor: FF9A3C
		FlameSize: 0.8
		FirePlume: 0.5
		TrailLife: 30
		LaunchPuffs: 0
	Warhead@1Dam: SpreadDamage
		Spread: 426
		Damage: 23000
		ValidTargets: GroundActor, WaterActor
		Versus:
			None: 90
			Wood: 40
			Light: 60
			Heavy: 25
			Concrete: 50
		DamageTypes: Prone50Percent, TriggerProne, SmallExplosionDeath
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Crater
		ValidTargets: Ground, Infantry
	# HD explosion (OpenRA.Mods.RAPX/Warheads/PxExplosionWarhead.cs)
	Warhead@3Eff: PxExplosion
		Video: artillery-1, artillery-2, dirt-2
		Size: 1.2
		Smoke: 1.2
		ImpactSounds: ra|audio/sfx/kaboom15.ogg
		ValidTargets: Ground, GroundActor, WaterActor, Trees
	Warhead@4EffWater: CreateEffect
		Explosions: vsplash-1, vsplash-2, vbigsplash-1
		ImpactSounds: ra|audio/sfx/splash9.ogg
		ValidTargets: Water, Underwater
		InvalidTargets: Bridge

