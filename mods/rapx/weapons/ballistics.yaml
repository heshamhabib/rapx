# XR-85 (France only, rules/vehicles.yaml XR85): a slow, very heavy long-range gun. Out-ranges every tank and
# most defences; one hit wrecks light vehicles, three or four kill a heavy tank. Slow to reload and useless up close.
XR85Cannon:
	Inherits: ^Cannon
	ReloadDelay: 150
	Range: 12c0
	MinRange: 2c0
	Report: ra|audio/sfx/cannon1.ogg
	Projectile: Bullet
		Speed: 900
		Blockable: False
	Warhead@1Dam: SpreadDamage
		Spread: 384
		Damage: 24000
		Versus:
			None: 40
			Wood: 100
			Light: 110
			Heavy: 100
			Concrete: 90
	Warhead@3Eff: PxExplosion
		Size: 2.2
		Smoke: 2.0
		ImpactSounds: ra|audio/sfx/kaboom25.ogg
