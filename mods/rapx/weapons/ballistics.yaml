^Cannon:
	ReloadDelay: 50
	Range: 4c768
	Report: ra|audio/sfx/cannon1.ogg
	ValidTargets: Ground, Water, GroundActor, WaterActor
	Projectile: Bullet
		Speed: 682
		Image: 120MM
		Shadow: True
	Warhead@1Dam: SpreadDamage
		Spread: 128
		Damage: 4000
		ValidTargets: GroundActor, WaterActor
		Versus:
			None: 30
			Wood: 75
			Light: 75
			Concrete: 50
		DamageTypes: Prone50Percent, TriggerProne, ExplosionDeath
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Crater
		ValidTargets: Ground, Infantry
	# HD explosion (OpenRA.Mods.RAPX/Warheads/PxExplosionWarhead.cs)
	Warhead@3Eff: PxExplosion
		Size: 0.7
		Smoke: 0.7
		ImpactSounds: ra|audio/sfx/kaboom12.ogg
		ValidTargets: Ground, GroundActor, WaterActor, Trees
	Warhead@4EffWater: CreateEffect
		Explosions: small_splash
		ImpactSounds: ra|audio/sfx/splash9.ogg
		ValidTargets: Water, Underwater
		InvalidTargets: Bridge

