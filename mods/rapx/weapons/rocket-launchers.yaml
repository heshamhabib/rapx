# National rocket launchers (IDEA-17): one salvo weapon per nation.
# Ranges are scaled to the real V2RL (SCUD, 10 cells): the doc's range r becomes r + 5 cells.
# Salvos spread with PxRocket's Inaccuracy (Maximum: grows with distance up to the value at full range).
# Every launcher fires salvos of its real rockets from the pods or tubes of its own model (phase 3, user decision:
# real pods, real salvos).
# Look: each fires a model of its real rocket (pxmissile sequences, artsrc/jets/make_rockets.sh) with its own smoke and
# flame (PxRocket SmokeColor / TrailSize / FlameSize / FlameColor) and its own blast (PxExplosion Style / colours).
# Length/Width place the exhaust flame: about 95 / 268 world units per metre of rocket length / diameter.

^PxSalvoRocket:
	Inherits: ^AntiGroundMissile
	ReloadDelay: 300
	Range: 13c0
	MinRange: 3c0
	Report: ra|audio/sfx/missile6.ogg
	Projectile: PxRocket
		LaunchVideo: launch-blast-a
		LaunchVideoScale: 0.65
		ThreatType: Rocket
		Image: pxmissile
		Speed: 200
		Arc: 0.3
		TrailDensity: 2
		TrailLife: 50
		LaunchPuffs: 8
		Inaccuracy: 1c512
	Warhead@1Dam: SpreadDamage
		Spread: 256
		Damage: 1600
		Falloff: 1000, 368, 135, 50, 18, 7, 0
		ValidTargets: GroundActor, WaterActor, Trees
		Versus:
			None: 90
			Wood: 75
			Tree: 75
			Light: 60
			Heavy: 35
			Concrete: 80
		DamageTypes: Prone50Percent, TriggerProne, SmallExplosionDeath, Incendiary
	Warhead@3Eff: PxExplosion
		Video: artillery-a, artillery-b, dirt-a
		VideoScale: 0.75
		Size: 1.2
		ImpactSounds: ra|audio/sfx/kaboom25.ogg

