# The Fatman bomb (USA bomber strike, rules/fatman.yaml): a free-falling atomic bomb with about half the nuke's
# reach (Atomic in superweapons.yaml): blast rings to 3 cells instead of 5, a smaller mushroom cloud
# (explosion fatman-nuke in sequences/fatman.yaml) and a shorter radiation burst.

Fatman:
	ValidTargets: Ground, Water, GroundActor, WaterActor, Underwater, AirborneActor, Trees
	Projectile: GravityBomb
		Image: fatman
		Sequences: falling
		Shadow: True
		# From cruise altitude (2560) to the ground in about 58 ticks (PxStrategicBomber FallTicks)
		Velocity: 0, 0, -15
		Acceleration: 0, 0, -1
	Warhead@1Dam_impact: SpreadDamage
		Spread: 1c0
		Damage: 12000
		Falloff: 1000, 368, 135, 50, 18, 7, 0
		ValidTargets: GroundActor, WaterActor, Underwater, AirborneActor, Trees
		Versus:
			Wood: 25
			Concrete: 25
		DamageTypes: Prone50Percent, TriggerProne, FireDeath, Incendiary
	Warhead@2Res_impact: DestroyResource
		Size: 1
	Warhead@3Smu_impact: LeaveSmudge
		SmudgeType: NukeScorch
		ValidTargets: Ground, Infantry
		Size: 1
	Warhead@4Eff_impact: CreateEffect
		Explosions: fatman-nuke
		ImpactSounds: ra|audio/sfx/kaboom1.ogg
		ImpactActors: false
		ValidTargets: Ground, Water, Air
	Warhead@5Dam_area1: SpreadDamage
		Spread: 2c0
		Damage: 5000
		Falloff: 1000, 368, 135, 50, 18, 7, 0
		Delay: 5
		ValidTargets: GroundActor, WaterActor, Underwater, AirborneActor, Trees
		Versus:
			Wood: 25
			Concrete: 25
		DamageTypes: Prone50Percent, TriggerProne, FireDeath, Incendiary
	Warhead@6Res_area1: DestroyResource
		Size: 2
		Delay: 5
	Warhead@7Smu_area1: LeaveSmudge
		SmudgeType: NukeScorch
		ValidTargets: Ground, Infantry
		Size: 2
		Delay: 5
	Warhead@8Eff_area1: CreateEffect
		ImpactSounds: ra|audio/sfx/kaboom22.ogg
		Delay: 5
		ImpactActors: false
	Warhead@9Dam_area2: SpreadDamage
		Spread: 3c0
		Damage: 4000
		Falloff: 1000, 368, 135, 50, 18, 7, 0
		Delay: 10
		ValidTargets: GroundActor, Trees, WaterActor, Underwater, AirborneActor
		Versus:
			Wood: 50
			Tree: 200
			Concrete: 25
		DamageTypes: Prone50Percent, TriggerProne, FireDeath, Incendiary
	Warhead@10Res_area2: DestroyResource
		Size: 3
		Delay: 10
	Warhead@11Smu_area2: LeaveSmudge
		SmudgeType: NukeScorch
		ValidTargets: Ground, Infantry
		Size: 3
		Delay: 10
	Warhead@12Shake: ShakeScreen
		Duration: 14
		Intensity: 3
		Multiplier: 1,1
	Warhead@13FlashEffect: FlashEffect
		Duration: 12
		FlashType: Nuke
	Warhead@14Radiation: PxRadiation
		Radius: 3c512
		Duration: 50
		Interval: 5
		Damage: 2500
		EdgeDamage: 45
		DamageTypes: DefaultDeath
		ValidTargets: Ground, Water, GroundActor, WaterActor
