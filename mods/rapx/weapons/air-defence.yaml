# IDEA-26 layered air defence: the interceptors PxInterceptor launches (cosmetic: the hit or miss is rolled by the
# trait when they meet the threat; a burst in the air, no damage) and the anti-aircraft weapons of tiers 2-3.
# Each interceptor's projectile Speed must match its PxInterceptor Speed, so it arrives when the roll happens.
# ThreatType Interceptor: air defence never shoots at interceptors.
# Look (IDEA-44, Iron Dome photo): every interceptor leaves its launcher almost straight up and bends over onto the
# threat (Profile Vertical), leaves a glowing long-exposure streak that hangs in the sky for ~3 s (StreakLife), and
# bursts in an orange fireball next to it (no damage, no screen shake). The rocket it hits bursts too.

# Tier 1 (AA Gun): a flak burst
InterceptFlak:
	Report: ra|audio/sfx/aacanon3.ogg
	Projectile: Bullet
		Speed: 600
		Blockable: false
		ContrailLength: 6
		ContrailStartWidth: 0c24
		ContrailStartColor: FFE6A0
	Warhead@1Eff: PxExplosion
		AirVideo: flak-1
		Size: 0.3
		Smoke: 0.3
		Scorch: false

^Interceptor:
	Report: ra|audio/sfx/missile6.ogg
	Projectile: PxRocket
		ThreatType: Interceptor
		TrackTarget: false
		Profile: Vertical
		Climb: 0.5
		MinClimb: 1536
		Length: 160
		Width: 40
		BodyColor: E6E6E1
		NoseColor: B4281E
		FlameColor: FFD278
		SmokeColor: F0F0F0
		TrailDensity: 2
		TrailLife: 40
		LaunchPuffs: 8
		StreakLife: 75
		StreakColor: FFB860
		StreakWidth: 12
	Warhead@1Eff: PxExplosion
		AirVideo: intercept-1
		Style: Fireball
		Size: 0.5
		Smoke: 0.5
		Scorch: false
		Shake: false
		Wave: false

# Tier 1 (SAM Site) and tier 2 (Medium SAM)
InterceptSAM:
	Inherits: ^Interceptor
	Projectile: PxRocket
		Speed: 560

# Tier 3 (Long-range SAM): Patriot / S-400 class, bigger and faster
InterceptLong:
	Inherits: ^Interceptor
	Report: ra|audio/sfx/missile1.ogg
	Projectile: PxRocket
		Speed: 460
		Length: 220
		Width: 50
		TrailSize: 1.2
		LaunchPuffs: 12

# Tier 4 (Missile Shield): THAAD class, very fast, climbs high
InterceptBMD:
	Inherits: ^Interceptor
	Report: ra|audio/sfx/missile1.ogg
	Projectile: PxRocket
		Speed: 620
		Climb: 0.7
		Length: 260
		Width: 56
		TrailSize: 1.4
		LaunchPuffs: 16
	Warhead@1Eff: PxExplosion
		Size: 0.7

# Anti-aircraft missiles of the Medium and Long-range SAMs (they also shoot aircraft)
MSAM_AA:
	Inherits: Nike
	ReloadDelay: 40
	Range: 11c0
	Warhead@1Dam: SpreadDamage
		Damage: 6000

LSAM_AA:
	Inherits: Nike
	ReloadDelay: 60
	Range: 15c0
	Projectile: PxRocket
		Speed: 480
		Length: 240
		Width: 52
	Warhead@1Dam: SpreadDamage
		Damage: 9000
	Warhead@3Eff: PxExplosion
		Size: 1.0

# Flak Cannon (rules/air-defence.yaml FLAK): twin heavy flak barrels; bursts in the air hurt every aircraft near them
FlakCannon:
	Inherits: FlakGun
	ReloadDelay: 30
	Range: 8c0
	Burst: 2
	BurstDelays: 4
	Report: ra|audio/sfx/aacanon3.ogg
	Projectile: PxTracer
		Rounds: 1
		Width: 28
		Inaccuracy: 300
	Warhead@1Dam: SpreadDamage
		Spread: 640
		Damage: 2200
