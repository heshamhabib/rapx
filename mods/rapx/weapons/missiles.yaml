SCUD:
	Inherits: ^AntiGroundMissile
	ReloadDelay: 215
	Range: 10c0
	MinRange: 4c0
	Report: ra|audio/sfx/missile1.ogg
	-Projectile:
	# HD rocket (OpenRA.Mods.RAPX/Projectiles/PxRocket.cs): the V2 rocket from the launcher's rail itself
	# (pxmissile v2*, artsrc/units/vehicles/make_v2_rocket.sh). It leaves the rail slowly, then climbs and dives.
	# Length = half the rocket, so the exhaust starts at its tail.
	Projectile: PxRocket
		ThreatType: Ballistic
		Image: pxmissile
		Sequence: v2
		LaunchVideo: launch-blast-1, launch-blast-2
		LaunchVideoScale: 0.85
		ClimbSequence: v2-climb
		DiveSequence: v2-dive
		LaunchEase: 0.6
		Speed: 170
		Arc: 0.35
		Length: 975
		Width: 150
		FlameSize: 0.6
		TrailDensity: 3
		TrailLife: 70
		LaunchPuffs: 18
	Warhead@1Dam: SpreadDamage
		Spread: 341
		Damage: 4500
		Falloff: 1000, 368, 135, 50, 18, 7, 0
		ValidTargets: GroundActor, WaterActor, Trees
		Versus:
			None: 90
			Wood: 75
			Tree: 75
			Light: 70
			Heavy: 40
			Concrete: 100
		DamageTypes: Prone50Percent, TriggerProne, SmallExplosionDeath, Incendiary
	Warhead@3Eff: PxExplosion
		Video: heavy-missile-1, heavy-missile-2
		Size: 2.2
		ImpactSounds: ra|audio/sfx/firebl3.ogg
	Warhead@4EffWater: CreateEffect
		Explosions: vbigsplash-1

