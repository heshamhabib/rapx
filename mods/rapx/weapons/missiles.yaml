^AntiGroundMissile:
	ReloadDelay: 50
	Range: 5c0
	MinRange: 0c512
	Report: ra|audio/sfx/missile6.ogg
	ValidTargets: Ground, Water, GroundActor, WaterActor
	# HD rocket (OpenRA.Mods.RAPX/Projectiles/PxRocket.cs)
	Projectile: PxRocket
		ThreatType: ATGM
		Speed: 220
		Arc: 0.12
	Warhead@1Dam: SpreadDamage
		Spread: 128
		Damage: 5000
		ValidTargets: GroundActor, WaterActor
		Versus:
			None: 10
			Wood: 74
			Light: 34
			Heavy: 100
			Concrete: 50
		DamageTypes: Prone50Percent, TriggerProne, ExplosionDeath
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Crater
		ValidTargets: Ground, Infantry
	Warhead@3Eff: PxExplosion
		Video: cannon-1, cannon-2, dirt-1, dirt-2
		AirVideo: airburst-1, airburst-2
		Size: 1.0
		ImpactSounds: ra|audio/sfx/kaboom25.ogg
		ValidTargets: Ground, Air, GroundActor, AirborneActor, WaterActor, Trees
	Warhead@4EffWater: CreateEffect
		Explosions: vsplash-1, vsplash-2, vbigsplash-1
		ImpactSounds: ra|audio/sfx/splash9.ogg
		ValidTargets: Water, Underwater
		InvalidTargets: Bridge

