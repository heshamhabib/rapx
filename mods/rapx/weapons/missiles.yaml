^SubMissileDefault:
	Inherits: ^AntiGroundMissile
	ReloadDelay: 300
	Range: 8c0
	Burst: 2
	# HD rocket fired from under water: foam and steam at launch, then fire and a smoke trail; a Tomahawk model
	Projectile: PxRocket
		ThreatType: Cruise
		Image: pxmissile
		Sequence: tomahawk
		Speed: 234
		Arc: 0.15
		Length: 560
		Width: 90
		TrailDensity: 3
		TrailLife: 70
		LaunchPuffs: 16
		WaterLaunch: true
	Warhead@1Dam: SpreadDamage
		Spread: 426
		Damage: 2500
		Falloff: 1000, 368, 135, 50, 18, 7, 0
		Versus:
			None: 80
			Wood: 50
			Light: 48
			Heavy: 30
			Concrete: 100
