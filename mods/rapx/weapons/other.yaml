^FireWeapon:
	ValidTargets: Ground, Water, GroundActor, WaterActor, Trees
	ReloadDelay: 70
	Range: 5c0
	Warhead@1Dam: SpreadDamage
		Spread: 213
		Damage: 15000
		ValidTargets: GroundActor, WaterActor, Trees
		Versus:
			None: 90
			Wood: 50
			Tree: 50
			Light: 60
			Heavy: 25
			Concrete: 20
		DamageTypes: Prone50Percent, TriggerProne, FireDeath, Incendiary
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Scorch
		InvalidTargets: Structure, Wall
	# HD fire (OpenRA.Mods.RAPX/Warheads/PxFireWarhead.cs): a burst of rolling fireballs, then the ground burns
	Warhead@3Eff: PxFire
		Size: 1
		Duration: 50
		ImpactSounds: firebl3.aud

FireballLauncher:
	Inherits: ^FireWeapon
	Burst: 2
	BurstDelays: 20
	Projectile: Bullet
		Speed: 250
		TrailImage: fb2
		Image: FB1
	Warhead@1Dam: SpreadDamage
		Versus:
			Light: 50

Flamer:
	Inherits: ^FireWeapon
	ReloadDelay: 50
	Burst: 15
	BurstDelays: 1
	# HD flame jet (OpenRA.Mods.RAPX/Projectiles/PxFlame.cs): rolling fireballs that turn into smoke
	Projectile: PxFlame
		Speed: 170
		Inaccuracy: 853
	Warhead@1Dam: SpreadDamage
		Spread: 341
		Damage: 1000
		Versus:
			None: 70
			Wood: 80
			Tree: 80
			Light: 40
			Heavy: 20
			Concrete: 10
	Warhead@2Smu: LeaveSmudge
		Chance: 15
	Warhead@3Eff: PxFire
		Size: 0.45
		Duration: 24
		Smoke: 0.5

Napalm:
	Inherits: ^FireWeapon
	ReloadDelay: 20
	Range: 4c512
	Projectile: Bullet
		Image: BOMBLET
		Speed: 85
		Blockable: false
	Warhead@1Dam: SpreadDamage
		Spread: 170
		Damage: 10000
		Versus:
			Wood: 100
			Concrete: 50
	Warhead@3Eff: PxFire
		Size: 1.4
		Duration: 70


^TeslaWeapon:
	ReloadDelay: 3
	Range: 7c0
	Report: tesla1.aud
	# HD lightning (OpenRA.Mods.RAPX/Projectiles/PxLightning.cs) instead of the classic litning sprites
	Projectile: PxLightning
	ValidTargets: Ground, Water, GroundActor, WaterActor
	Warhead@1Dam: SpreadDamage
		Spread: 42
		Damage: 10000
		ValidTargets: GroundActor, WaterActor
		Versus:
			None: 1000
		DamageTypes: Prone50Percent, TriggerProne, ElectricityDeath

TeslaZap:
	Inherits: ^TeslaWeapon
	Warhead@1Dam: SpreadDamage
		Versus:
			Wood: 60

PortaTesla:
	Inherits: ^TeslaWeapon
	ReloadDelay: 70
	Range: 6c0
	Warhead@1Dam: SpreadDamage
		Damage: 4500
		Versus:
			Wood: 73
			Heavy: 60
	Projectile: PxLightning
		Width: 34
		Branches: 2
		MuzzleFlare: 180
		ImpactFlare: 300
		Duration: 10

TTankZap:
	Inherits: ^TeslaWeapon
	ReloadDelay: 120
	Range: 7c0
	Projectile: PxLightning
		Width: 60
		Branches: 5
		Strands: 2
		ImpactFlare: 520

# T4-B Tesla Tank: a bolt from each side cannon at once (rules TTNK LocalOffset lists both); half the damage per
# bolt, so the tank's firepower is unchanged
TTankZap.Twin:
	Inherits: TTankZap
	Burst: 2
	BurstDelays: 0
	Warhead@1Dam: SpreadDamage
		Damage: 5000

