^FireWeapon:
	ValidTargets: Ground, Water, GroundActor, WaterActor, Trees
	ReloadDelay: 70
	Range: 5c0
	Warhead@1Dam: SpreadDamage
		Spread: 213
		Damage: 15000
		ValidTargets: GroundActor, WaterActor, Trees
		Versus:
			None: 90
			Wood: 50
			Tree: 50
			Light: 60
			Heavy: 25
			Concrete: 20
		DamageTypes: Prone50Percent, TriggerProne, FireDeath, Incendiary
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Scorch
		InvalidTargets: Structure, Wall
	# HD fire (OpenRA.Mods.RAPX/Warheads/PxFireWarhead.cs): a burst of rolling fireballs, then the ground burns
	Warhead@3Eff: PxFire
		Size: 1
		Duration: 50
		ImpactSounds: ra|audio/sfx/firebl3.ogg

FireballLauncher:
	Inherits: ^FireWeapon
	Burst: 2
	BurstDelays: 20
	Projectile: Bullet
		Speed: 250
		TrailImage: fb2
		Image: FB1
	Warhead@1Dam: SpreadDamage
		Versus:
			Light: 50

Flamer:
	Inherits: ^FireWeapon
	ReloadDelay: 50
	Burst: 15
	BurstDelays: 1
	# HD flame jet (OpenRA.Mods.RAPX/Projectiles/PxFlame.cs): rolling fireballs that turn into smoke
	Projectile: PxFlame
		Speed: 170
		Inaccuracy: 853
	Warhead@1Dam: SpreadDamage
		Spread: 341
		Damage: 1000
		Versus:
			None: 70
			Wood: 80
			Tree: 80
			Light: 40
			Heavy: 20
			Concrete: 10
	Warhead@2Smu: LeaveSmudge
		Chance: 15
	Warhead@3Eff: PxFire
		Size: 0.45
		Duration: 24
		Smoke: 0.5

Napalm:
	Inherits: ^FireWeapon
	ReloadDelay: 20
	Range: 4c512
	Projectile: Bullet
		Image: BOMBLET
		Speed: 85
		Blockable: false
	Warhead@1Dam: SpreadDamage
		Spread: 170
		Damage: 10000
		Versus:
			Wood: 100
			Concrete: 50
	Warhead@3Eff: PxFire
		Size: 1.4
		Duration: 220
		Video: napalm-a
		BurnVideo: fire-big-b
		VideoScale: 0.55


^TeslaWeapon:
	ReloadDelay: 3
	Range: 7c0
	Report: ra|audio/sfx/tesla1.ogg
	# HD lightning (OpenRA.Mods.RAPX/Projectiles/PxLightning.cs) instead of the classic litning sprites
	Projectile: PxLightning
	ValidTargets: Ground, Water, GroundActor, WaterActor
	Warhead@1Dam: SpreadDamage
		Spread: 42
		Damage: 10000
		ValidTargets: GroundActor, WaterActor
		Versus:
			None: 1000
		DamageTypes: Prone50Percent, TriggerProne, ElectricityDeath

TeslaZap:
	Inherits: ^TeslaWeapon
	Warhead@1Dam: SpreadDamage
		Versus:
			Wood: 60

PortaTesla:
	Inherits: ^TeslaWeapon
	ReloadDelay: 70
	Range: 6c0
	Warhead@1Dam: SpreadDamage
		Damage: 4500
		Versus:
			Wood: 73
			Heavy: 60
	Projectile: PxLightning
		Width: 34
		Branches: 2
		MuzzleFlare: 180
		ImpactFlare: 300
		Duration: 10

TTankZap:
	Inherits: ^TeslaWeapon
	ReloadDelay: 120
	Range: 7c0
	Projectile: PxLightning
		Width: 60
		Branches: 5
		Strands: 2
		ImpactFlare: 520

# T4-B Tesla Tank: a bolt from each side cannon at once (rules TTNK LocalOffset lists both); half the damage per
# bolt, so the tank's firepower is unchanged
TTankZap.Twin:
	Inherits: TTankZap
	Burst: 2
	BurstDelays: 0
	Warhead@1Dam: SpreadDamage
		Damage: 5000

DogJaw:
	ValidTargets: Infantry
	ReloadDelay: 10
	Range: 3c0
	Report: ra|audio/dog/dogg5p.ogg
	TargetActorCenter: true
	Projectile: InstantHit
	Warhead@1Dam: TargetDamage
		Damage: 100000
		ValidTargets: Infantry
		DamageTypes: DefaultDeath

# Nile Crocodile (rules/infantry.yaml CROC): one bite kills a soldier or a dog
CrocJaws:
	ValidTargets: Infantry
	ReloadDelay: 50
	Range: 1c768
	Report: ra|audio/croc/croc-snap1.ogg, ra|audio/croc/croc-snap2.ogg
	TargetActorCenter: true
	Projectile: InstantHit
	Warhead@1Dam: TargetDamage
		Damage: 100000
		ValidTargets: Infantry
		DamageTypes: DefaultDeath

Heal:
	ReloadDelay: 80
	Range: 4c0
	Report: ra|audio/sfx/heal2.ogg
	ValidTargets: Heal
	Projectile: Bullet
		Speed: 1c682
	Warhead@1Eff: FlashTargetsInRadius
		Radius: 1065
		ValidRelationships: Ally
		ValidTargets: Heal
	Warhead@2Dam: SpreadDamage
		Spread: 213
		Damage: -5000
		ValidRelationships: Ally
		ValidTargets: Heal
		DebugOverlayColor: 00FF00

Repair:
	Inherits: Heal
	Report: ra|audio/sfx/fixit1.ogg
	ValidTargets: Repair
	Warhead@1Eff: FlashTargetsInRadius
		ValidTargets: Repair
	Warhead@2Dam: SpreadDamage
		Damage: -2000
		ValidTargets: Repair

Demolish:
	ValidTargets: GroundActor, WaterActor
	Warhead@1Dam: SpreadDamage
		DamageTypes: DefaultDeath
		ValidTargets: GroundActor, WaterActor
	Warhead@2Eff: CreateEffect
		Explosions: building
		ImpactSounds: ra|audio/sfx/kaboom25.ogg

DemoTruckTargeting:
	ValidTargets: DetonateAttack
	Range: 2c0
	Projectile: InstantHit
	Warhead@1Dam: TargetDamage
		ValidTargets: DetonateAttack

MADTankThump:
	ValidTargets: GroundActor, WaterActor
	InvalidTargets: MADTank, Infantry
	Warhead@1Dam: HealthPercentageDamage
		Spread: 7c0
		Damage: 1
		ValidTargets: GroundActor, WaterActor
		InvalidTargets: MADTank, Infantry
	Warhead@Shake: ShakeScreen
		Duration: 10
		Intensity: 3
		Multiplier: 1,0

MADTankDetonate:
	ValidTargets: GroundActor, WaterActor
	InvalidTargets: MADTank, Infantry
	Warhead@1Dam: HealthPercentageDamage
		Spread: 7c0
		Damage: 19
		ValidTargets: GroundActor, WaterActor
		InvalidTargets: MADTank, Infantry
	Warhead@2Smu: LeaveSmudge
		SmudgeType: Crater
		Size: 7,6
	Warhead@3Eff: CreateEffect
		Explosions: med_explosion
		ImpactSounds: ra|audio/sfx/mineblo1.ogg
		ImpactActors: false

# Shockfang (rules/vehicles.yaml SFNG): a heavy electric discharge from its cannon
ShockfangZap:
	Inherits: TTankZap
	ReloadDelay: 90
	Range: 7c0
	Warhead@1Dam: SpreadDamage
		Damage: 12000
