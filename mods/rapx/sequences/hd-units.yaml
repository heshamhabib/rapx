# High resolution unit art (RedAlert Project X), overriding the classic sequences.
# Sprites are rendered from procedural Blender models: see artsrc/units/<unit>/make.sh.
# Frames are evenly spaced counter-clockwise from north, so UseClassicFacings is off.
# Vehicles are drawn 1.4x their render size (Scale 0.4667) so they read right next to the HD infantry;
# rules/vehicles.yaml turret/weapon offsets and DecorationBounds were scaled by the same 1.4.
# Pure green areas are recoloured to the owner's colour by PlayerColorShift.

# Minelayer: AI-generated model (artsrc/units/meshes); the older procedural one is in artsrc/units/minelayer.
# Minelayer / Supply Truck / Flak Truck: Sketchfab M113, Ural 4320, Pantsir-S1 (2x pixels)
mnly:
	idle:
		Filename: ra|bits/hd/units/mnly.png
		Facings: 32
		UseClassicFacings: False
		Scale: 0.2333

# Ore truck: sheets keep the classic harv.shp frame layout (see artsrc/units/harvester/render_harvester.py),
# so the stock Start / Length / Facings values still apply. Docking always uses the full truck, as in the original.
# Scale is set per sequence (not in Defaults) so the classic icon keeps its size. 0.3267 = 0.7 x the other
# vehicles' 0.4667: the model is rendered at 13.6 units long, which looked twice a tank's size in game.
harv:
	Defaults:
		Filename: ra|bits/hd/units/harv.png
	idle:
		UseClassicFacings: False
		Scale: 0.3267
	harvest:
		Scale: 0.3267
	dock:
		Filename: ra|bits/hd/units/harv.png
		Scale: 0.3267
	dock-loop:
		Filename: ra|bits/hd/units/harv.png
		Scale: 0.3267

harvempty:
	Defaults:
		Filename: ra|bits/hd/units/harvempty.png

harvhalf:
	Defaults:
		Filename: ra|bits/hd/units/harvhalf.png

hhusk:
