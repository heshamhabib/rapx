# Airborne Base (rules/airborne.yaml): its art is in hd-structures.yaml (build_all.py), the sidebar tile in hd-icons.yaml.
# Drawn as ground: ZOffset reaches past the pads (half the 6-cell depth), so parked transports stay on top.
abrn:
	idle:
		ZOffset: -3072
	damaged-idle:
		ZOffset: -3072
	active:
		ZOffset: -3072
	damaged-active:
		ZOffset: -3072
	icon:
		Filename: ra|bits/hd/abrncameo.png

