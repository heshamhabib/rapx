snip:
	icon:
		Filename: ra|bits/hd/icons/snipcameo.png
		Scale: 0.5
	# The shared infantry effects his own image lacks: crushed corpse and the electrocution death
	die-crushed:
		Filename: corpse1.tem
		TilesetFilenames:
			SNOW: corpse1.sno
		Length: 6
		Tick: 1600
		ZOffset: -511
