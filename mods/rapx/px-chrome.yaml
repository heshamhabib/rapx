# RedAlert Project X UI skin. Art is generated by artsrc/px-ui/generate.py;
# coordinates here must match the layout in that script (1x pixels).

^PXUI:
	Image: px-ui.png
	Image2x: px-ui-2x.png

px-dialog:
	Inherits: ^PXUI
	PanelRegion: 0, 0, 16, 16, 32, 32, 16, 16

px-button:
	Inherits: ^PXUI
	PanelRegion: 0, 64, 8, 8, 16, 16, 8, 8

px-button-hover:
	Inherits: ^PXUI
	PanelRegion: 32, 64, 8, 8, 16, 16, 8, 8

px-button-pressed:
	Inherits: ^PXUI
	PanelRegion: 64, 64, 8, 8, 16, 16, 8, 8

px-button-disabled:
	Inherits: ^PXUI
	PanelRegion: 96, 64, 8, 8, 16, 16, 8, 8

px-button-focused:
	Inherits: px-button-hover

px-button-highlighted:
	Inherits: ^PXUI
	PanelRegion: 128, 64, 8, 8, 16, 16, 8, 8

px-button-highlighted-hover:
	Inherits: ^PXUI
	PanelRegion: 160, 64, 8, 8, 16, 16, 8, 8

px-button-highlighted-pressed:
	Inherits: ^PXUI
	PanelRegion: 192, 64, 8, 8, 16, 16, 8, 8

px-button-highlighted-disabled:
	Inherits: ^PXUI
	PanelRegion: 224, 64, 8, 8, 16, 16, 8, 8

px-field:
	Inherits: ^PXUI
	PanelRegion: 0, 96, 8, 8, 16, 16, 8, 8

px-field-hover:
	Inherits: ^PXUI
	PanelRegion: 32, 96, 8, 8, 16, 16, 8, 8

px-field-focused:
	Inherits: ^PXUI
	PanelRegion: 64, 96, 8, 8, 16, 16, 8, 8

px-field-disabled:
	Inherits: ^PXUI
	PanelRegion: 96, 96, 8, 8, 16, 16, 8, 8

px-field-pressed:
	Inherits: px-field-focused

px-field-highlighted:
	Inherits: px-field-focused

px-field-highlighted-hover:
	Inherits: px-field-focused

px-section:
	Inherits: ^PXUI
	PanelRegion: 0, 128, 8, 0, 48, 13, 8, 0

px-dropdown-separators:
	Inherits: ^PXUI
	Regions:
		separator: 0, 150, 1, 19
		separator-hover: 2, 150, 1, 19
		separator-pressed: 4, 150, 1, 19
		separator-disabled: 6, 150, 1, 19
		observer-separator: 6, 150, 1, 19

px-deco:
	Inherits: ^PXUI
	Regions:
		title-line: 0, 176, 320, 6

px-menu-panel:
	Inherits: ^PXUI
	PanelRegion: 0, 256, 40, 40, 48, 48, 40, 40

px-menu-button:
	Inherits: ^PXUI
	PanelRegion: 0, 384, 24, 12, 48, 16, 24, 12

px-menu-button-hover:
	Inherits: ^PXUI
	PanelRegion: 96, 384, 24, 12, 48, 16, 24, 12

px-menu-button-pressed:
	Inherits: ^PXUI
	PanelRegion: 192, 384, 24, 12, 48, 16, 24, 12

px-menu-button-disabled:
	Inherits: ^PXUI
	PanelRegion: 288, 384, 24, 12, 48, 16, 24, 12

px-menu-button-focused:
	Inherits: px-menu-button-hover

px-menu-button-highlighted:
	Inherits: px-menu-button-hover

px-menu-button-highlighted-hover:
	Inherits: px-menu-button-pressed

px-menu-button-highlighted-pressed:
	Inherits: px-menu-button-pressed

px-menu-button-highlighted-disabled:
	Inherits: px-menu-button-disabled

